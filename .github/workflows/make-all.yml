name: make-all

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  make-all:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Prepare real systemd and SSH session tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server bubblewrap
          sudo mkdir -p /run/sshd
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

          pin=$(mktemp -d)
          trap 'rmdir "$pin"' EXIT
          probe_pin() {
            systemd-run --user --wait --collect --pipe --quiet /usr/bin/bwrap --unshare-user --dev-bind / / \
              --ro-bind "$pin" "$pin" -- /usr/bin/python3 -c 'import os,sys; assert os.statvfs(sys.argv[1]).f_flag & os.ST_RDONLY' "$pin"
          }
          if ! result=$(probe_pin 2>&1); then
            printf '%s\n' "$result"
            if [[ "$result" != *"No permissions to create"* && "$result" != *"Operation not permitted"* && "$result" != *"Permission denied"* ]]; then
              exit 1
            fi
            # Hosted runners can install bwrap without enabling its user namespace profile.
            if ! { test -r /etc/apparmor.d/bwrap && sudo apparmor_parser -r /etc/apparmor.d/bwrap && probe_pin; }; then
              test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
              probe_pin
            fi
          fi

      - name: Verify make all including real SSH phase handoffs
        env:
          SYMPHONY_TEST_BIND_INSTRUCTIONS: "1"
          SYMPHONY_TEST_SYSTEMD: "1"
        run: python3 ../scripts/run_session_tests.py make all

      - name: Verify containment, deployment script and CI gating
        run: python3 ../scripts/run_session_tests.py python3 -m unittest discover -s ../scripts -p 'test_*.py'
